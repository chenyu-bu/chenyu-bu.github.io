# --- Build settings ---
markdown: kramdown
encoding: utf-8

# All layouts and CSS in this repo are hand-written, so no gem theme is used.
# This must be an explicit `null`: if the key is absent, GitHub Pages falls
# back to jekyll-theme-primer and starts building that theme's stylesheet.
# jekyll-seo-tag is listed below because it used to arrive only as a
# dependency of the minima theme that this replaces.
theme: null

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - bin
  - extensions
  - specifications
