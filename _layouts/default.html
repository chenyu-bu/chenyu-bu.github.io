<!DOCTYPE html>
<html lang="{{ site.lang }}">
  <head>
    {% include header.html %}
  </head>
  <body class="{% if page.url == '/' %}home{% endif %}">
    {% include nav.html %}
    <div class="container">
      <img src="/assets/img/grunge.png" alt="" class="line">
      <p class="center author">{{ site.author }}</p>
      <img src="/assets/img/grunge.png" alt="" class="line flip">
      <div style="margin-top: 25px;"></div>
      {{ content }}

      {% if page.url == "/" %}
        <img src="/assets/img/profile-640.jpg" alt="Chenyu Bu" width="457" height="640"
             style="max-width: 320px; height: auto; border-radius: 8px; display: block; margin: auto;">
        <h1 class="brand title center" id="type">About Me</h1>
        <div class="center home-about">{{ site.about | markdownify }}</div>
        <img src="/assets/img/grunge.png" alt="" class="line tag flip">
        <p class="right tagline">{{ site.contact_line | newline_to_br }}</p>
        <img src="/assets/img/grunge.png" alt="" class="line tag">
        <br>
        {% include articles.html %}
      {% endif %}
    </div>
    {% include foot.html %}
  </body>
</html>
